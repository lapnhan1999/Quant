name: market-data

on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/**", ".github/workflows/market-data.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --quiet requests pandas numpy yfinance tabulate
          pip install --quiet vnstock || echo "vnstock install failed"
      - name: Fetch market data
        run: python scripts/fetch_market_data.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: market snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
