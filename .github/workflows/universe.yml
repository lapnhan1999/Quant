name: universe

on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/fetch_universe.py", ".github/workflows/universe.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --quiet requests pandas numpy tabulate yfinance
      - name: Fetch universe
        run: python scripts/fetch_universe.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: market universe snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
